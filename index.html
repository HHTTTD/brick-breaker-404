<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<title>404 — Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F4F4;
    --ink:#121212;
    --grey:#7C7C7C;
    --mist:#C7C7C7;
    --hair:#E4E4E4;
    --live:#F0421E;
    --font:"Poppins","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    display:flex;
    height:100dvh;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* แถบซ้ายบาง ๆ — ลบทิ้งได้ถ้าเว็บคุณมีเมนูของตัวเองอยู่แล้ว */
  .rail{
    flex:0 0 72px;
    border-right:1px solid var(--hair);
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:34px;
  }
  .rail span{
    writing-mode:vertical-rl;transform:rotate(180deg);
    font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  }
  .rail span::after{
    content:"";display:block;width:1px;height:56px;margin:18px auto 0;background:var(--ink);
  }

  .stage{position:relative;flex:1;min-width:0}
  canvas{
    position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;
    touch-action:none;            /* เบราว์เซอร์เก่า */
    touch-action:pinch-zoom;      /* ใหม่: ลากนิ้วเดียวเป็นการเล่น สองนิ้วยังซูมได้ */
  }

  /* ข้อความวางทับ canvas — คลิกทะลุได้ ยกเว้นปุ่ม */
  .content{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:100%;padding:0 24px;text-align:center;pointer-events:none;
  }

  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
      overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

  /* ช่องว่างที่กำแพงอิฐจะไปวางพอดี — JS อ่านตำแหน่งจากตรงนี้ */
  .wall{
    width:clamp(272px,30vw,520px);
    aspect-ratio:31/12;
    margin:0 auto clamp(26px,4.4vh,52px);
    container-type:inline-size;
  }
  /* เลข 404 ตัวจริง — เห็นตอนโหลดและตอน JS ไม่ทำงาน แล้ว JS จะสลับเป็นอิฐ */
  .wall b{
    display:flex;align-items:center;justify-content:center;height:100%;
    font-weight:800;letter-spacing:-.02em;line-height:1;
    font-size:clamp(140px,15vw,258px);
    font-size:48cqw;
  }
  .wall.live b{opacity:0}

  .l1{margin:0;font-size:clamp(21px,3vw,38px);font-weight:500;color:var(--grey);line-height:1.2}
  .l2{margin:6px 0 0;font-size:clamp(16px,2.1vw,27px);font-weight:400;color:var(--mist);line-height:1.2}
  .l3{margin:4px 0 0;font-size:clamp(12px,1.1vw,14px);font-weight:400;color:var(--ink)}

  .home{
    pointer-events:auto;
    display:inline-block;margin-top:clamp(20px,3vh,32px);
    background:var(--ink);color:#fff;text-decoration:none;
    font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    padding:11px 20px;
    transition:opacity .18s;
  }
  .home:hover{opacity:.78}
  .home:focus-visible{outline:2px solid var(--live);outline-offset:3px}

  .hint{
    position:absolute;left:0;right:0;bottom:78px;
    text-align:center;font-size:10.5px;font-weight:600;
    letter-spacing:.2em;text-transform:uppercase;color:var(--live);
    pointer-events:none;transition:opacity .35s;
  }
  .hint.gone{opacity:0}

  .hud{
    position:absolute;right:22px;bottom:18px;
    display:flex;align-items:center;gap:12px;
    font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--mist);
    pointer-events:none;font-variant-numeric:tabular-nums;
  }
  .dots{display:flex;gap:5px}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--mist);transition:background .25s}
  .dots i.on{background:var(--live)}

  @media (max-width:680px){
    .rail{display:none}
    .wall{width:min(84vw,340px)}
    .hint{bottom:66px}
    .hud{right:16px}
  }
  /* มือถือแนวนอน / จอเตี้ย */
  @media (max-height:560px){
    .wall{width:min(42vw,300px);margin-bottom:12px}
    .l1{font-size:clamp(15px,2.2vw,21px)}
    .l2{font-size:clamp(12px,1.6vw,16px)}
    .l3{font-size:10.5px;margin-top:2px}
    .home{margin-top:10px;padding:8px 15px;font-size:10px}
    .hint{top:12px;bottom:auto}
    .hud{bottom:8px;right:12px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001ms !important}
  }
</style>
</head>
<body>

<div class="rail"><span>404 Page</span></div>

<div class="stage">
  <canvas id="game" aria-hidden="true"></canvas>

  <div class="content">
    <h1 class="sr">404 — Page not found</h1>
    <div class="wall" id="wall"><b aria-hidden="true">404</b></div>
    <p class="l1">Oops, This Page Not Found!</p>
    <p class="l2">The link might be corrupted,</p>
    <p class="l3">or the page may have been removed</p>
    <a class="home" href="/">Go back home</a>
  </div>

  <div class="hint" id="hint">Click to launch</div>

  <div class="hud">
    <span id="score">000</span>
    <span class="dots" id="dots"><i class="on"></i><i class="on"></i><i class="on"></i></span>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ── ปรับได้ ─────────────────────────────── */
  const CFG = {
    lives: 3,
    speed: 440,      // px/วินาที ที่ความสูงจอ 760px (สเกลตามจอเอง)
    speedUp: 1.005,  // เร็วขึ้นทุกครั้งที่โดนไม้
    maxMul: 1.8,     // เพดานความเร็ว (เท่าของความเร็วตั้งต้น)
    maxBalls: 6,     // เพดานจำนวนบอลพร้อมกัน
    dropRate: 0.055, // โอกาสที่อิฐหนึ่งก้อนจะปล่อยไอเทม
    wideTime: 12,    // วินาที
    slowTime: 10
  };
  /* ────────────────────────────────────────── */

  const GLYPH = {
    '4': ["......##.", ".....###.", "....####.", "...##.##.",
          "..##..##.", ".##...##.", "##....##.", "#########",
          "#########", "......##.", "......##.", "......##."],
    '0': ["..#####..", ".#######.", "###...###", "###...###",
          "###...###", "###...###", "###...###", "###...###",
          "###...###", "###...###", ".#######.", "..#####.."]
  };
  const WORD = ['4', '0', '4'], GAP = 2, GW = 9, ROWS = 12;
  const COLS = WORD.length * GW + (WORD.length - 1) * GAP;   // 31

  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const slot = document.getElementById('wall');
  const elScore = document.getElementById('score');
  const dots = [...document.getElementById('dots').children];
  const hint = document.getElementById('hint');

  const mm = q => typeof matchMedia === 'function' && matchMedia(q).matches;
  const soft = mm('(prefers-reduced-motion: reduce)');
  const coarse = mm('(pointer: coarse)');
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  let Wp = 0, Hp = 0, dpr = 1;
  let ox = 0, oy = 0, bw = 0, bh = 0;          // เรขาคณิตของกำแพง
  const grid = new Map();                      // key(col,row) -> true
  const key = (c, r) => c * 64 + r;

  let pops = [], drops = [], rings = [];
  let score = 0, lives = CFG.lives, launched = false, rally = 1;
  let wideT = 0, slowT = 0;

  const pad = { x: 0, y: 0, w: 120, h: 6, base: 120 };
  let balls = [];
  const keys = { l: false, r: false };

  /* ── วางกำแพงให้ตรงกับช่องว่างใน layout ──── */
  function layout() {
    const r = cv.getBoundingClientRect();
    Wp = r.width; Hp = r.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(Wp * dpr);
    cv.height = Math.round(Hp * dpr);

    const s = slot.getBoundingClientRect();
    ox = s.left - r.left; oy = s.top - r.top;
    bw = s.width / COLS; bh = s.height / ROWS;

    pad.base = Math.max(88, Math.min(158, Wp * 0.135));
    pad.w = wideT > 0 ? pad.base * 1.5 : pad.base;
    pad.h = Math.max(5, Math.round(Hp * 0.0075));
    pad.y = Hp - Math.max(42, Hp * 0.062);
    pad.x = Math.max(0, Math.min(Wp - pad.w, pad.x || (Wp - pad.w) / 2));
    for (const b of balls) b.r = Math.max(5, Math.min(8, Wp * 0.006));
    DROP_R = Math.max(10, Math.min(14, Wp * 0.012));
  }

  const baseSpeed = () => CFG.speed * Math.max(0.7, Math.min(1.45, Hp / 760));

  function build() {
    grid.clear();
    WORD.forEach((ch, d) => {
      GLYPH[ch].forEach((row, r) => {
        [...row].forEach((cell, c) => {
          if (cell === '#') grid.set(key(d * (GW + GAP) + c, r), true);
        });
      });
    });
    layout();
  }

  function serve() {
    launched = false;
    drops.length = 0;
    wideT = 0; slowT = 0; pad.w = pad.base;
    balls = [{ x: 0, y: 0, vx: 0, vy: 0, r: Math.max(5, Math.min(8, Wp * 0.006)), tr: [] }];
    hint.classList.remove('gone');
  }

  function launch() {
    if (launched) return;
    launched = true;
    const s = baseSpeed() * rally;
    const a = -Math.PI / 2 + (Math.random() * 0.5 - 0.25);
    balls[0].vx = Math.cos(a) * s;
    balls[0].vy = Math.sin(a) * s;
    hint.classList.add('gone');
  }

  const setScore = v => {
    score = Math.max(0, v);
    elScore.textContent = String(Math.min(score, 9999)).padStart(3, '0');
  };
  const setLives = v => {
    lives = v;
    dots.forEach((d, i) => d.classList.toggle('on', i < lives));
  };

  /* ── ฟิสิกส์ ─────────────────────────────── */
  function bouncePaddle(b) {
    if (b.vy <= 0) return false;
    if (b.y + b.r < pad.y || b.y - b.r > pad.y + pad.h) return false;
    if (b.x + b.r < pad.x || b.x - b.r > pad.x + pad.w) return false;
    const rel = Math.max(-1, Math.min(1, (b.x - (pad.x + pad.w / 2)) / (pad.w / 2)));
    let ang = rel * (Math.PI / 3);
    const MIN = 0.18;                          // กันบอลเด้งตั้งฉากค้างเป็นลูป
    if (Math.abs(ang) < MIN) ang = rel >= 0 ? MIN : -MIN;
    rally = Math.min(CFG.maxMul, rally * CFG.speedUp);
    const s = baseSpeed() * rally;
    b.vx = Math.sin(ang) * s;
    b.vy = -Math.abs(Math.cos(ang) * s);
    b.y = pad.y - b.r - 0.5;
    return true;
  }

  // เช็คเฉพาะ 9 ช่องรอบตัวลูกบอล — เร็วพอแม้อิฐ 170 ก้อน
  function hitBricks(b) {
    const c0 = Math.floor((b.x - ox) / bw), r0 = Math.floor((b.y - oy) / bh);
    for (let c = c0 - 1; c <= c0 + 1; c++) {
      for (let r = r0 - 1; r <= r0 + 1; r++) {
        const k = key(c, r);
        if (!grid.has(k)) continue;
        const bx = ox + c * bw, by = oy + r * bh;
        const nx = Math.max(bx, Math.min(b.x, bx + bw));
        const ny = Math.max(by, Math.min(b.y, by + bh));
        const dx = b.x - nx, dy = b.y - ny;
        if (dx * dx + dy * dy > b.r * b.r) continue;

        const px = (bw / 2 + b.r) - Math.abs(b.x - (bx + bw / 2));
        const py = (bh / 2 + b.r) - Math.abs(b.y - (by + bh / 2));
        if (px < py) { b.vx = -b.vx; b.x += b.vx > 0 ? px : -px; }
        else         { b.vy = -b.vy; b.y += b.vy > 0 ? py : -py; }

        grid.delete(k);
        setScore(score + 10);
        if (!soft) {
          pops.push({ x: bx + bw / 2, y: by + bh / 2, t: 0 });
          if (pops.length > 90) pops.shift();
        }
        if (Math.random() < CFG.dropRate) {
          const kinds = ['wide', 'multi', 'slow'];
          drops.push({ x: bx + bw / 2, y: by + bh / 2, kind: kinds[Math.floor(Math.random() * 3)] });
        }
        return;
      }
    }
  }

  function step(b, dt) {
    const n = Math.max(1, Math.ceil(Math.hypot(b.vx, b.vy) * dt / 4));
    const sdt = dt / n;
    for (let i = 0; i < n; i++) {
      b.x += b.vx * sdt; b.y += b.vy * sdt;
      if (b.x - b.r < 0)  { b.x = b.r; b.vx = Math.abs(b.vx); }
      if (b.x + b.r > Wp) { b.x = Wp - b.r; b.vx = -Math.abs(b.vx); }
      if (b.y - b.r < 0)  { b.y = b.r; b.vy = Math.abs(b.vy); }
      if (b.y - b.r > Hp) return false;
      if (bouncePaddle(b)) continue;
      hitBricks(b);
    }
    return true;
  }

  /* ── ไอเทม ───────────────────────────────── */
  let DROP_R = 13;

  function collect(kind, x, y) {
    setScore(score + 25);
    if (!soft) rings.push({ x, y, t: 0 });
    if (kind === 'wide') { wideT = CFG.wideTime; pad.w = pad.base * 1.5; }
    if (kind === 'slow') { slowT = CFG.slowTime; }
    if (kind === 'multi') {
      const src = balls[0];
      if (src && balls.length < CFG.maxBalls) {
        const s = Math.hypot(src.vx, src.vy) || baseSpeed() * rally;
        const a0 = Math.atan2(src.vy, src.vx);
        for (const off of [-0.5, 0.5]) {
          if (balls.length >= CFG.maxBalls) break;
          balls.push({ x: src.x, y: src.y, r: src.r, tr: [],
                       vx: Math.cos(a0 + off) * s, vy: Math.sin(a0 + off) * s });
        }
      }
    }
    pad.x = Math.max(0, Math.min(Wp - pad.w, pad.x));
  }

  /* ── อัปเดต ──────────────────────────────── */
  function update(dt) {
    const pv = Wp * 1.15 * dt;
    if (keys.l) pad.x -= pv;
    if (keys.r) pad.x += pv;
    pad.x = Math.max(0, Math.min(Wp - pad.w, pad.x));

    if (wideT > 0) { wideT -= dt; if (wideT <= 0) { pad.w = pad.base; pad.x = Math.min(pad.x, Wp - pad.w); } }
    if (slowT > 0) slowT -= dt;

    for (const p of pops) p.t += dt;
    pops = pops.filter(p => p.t < 0.32);
    for (const r of rings) r.t += dt;
    rings = rings.filter(r => r.t < 0.4);

    for (const d of drops) {
      d.y += (Hp * 0.26) * dt;
      if (d.y + DROP_R >= pad.y && d.y - DROP_R <= pad.y + pad.h &&
          d.x + DROP_R >= pad.x && d.x - DROP_R <= pad.x + pad.w) {
        d.got = true;
        collect(d.kind, d.x, d.y);
      }
    }
    drops = drops.filter(d => !d.got && d.y - DROP_R < Hp);

    if (!launched) {
      const b = balls[0];
      b.x = pad.x + pad.w / 2;
      b.y = pad.y - b.r - 3;
      b.tr.length = 0;
      return;
    }

    const sdt = slowT > 0 ? dt * 0.7 : dt;
    for (const b of balls) {
      if (!soft) { b.tr.push({ x: b.x, y: b.y }); if (b.tr.length > 9) b.tr.shift(); }
      if (!step(b, sdt)) b.out = true;
    }
    balls = balls.filter(b => !b.out);

    if (balls.length === 0) {                  // เสียลูก
      if (lives > 1) { setLives(lives - 1); rally = Math.max(1, rally * 0.85); serve(); }
      else { setLives(CFG.lives); setScore(0); rally = 1; build(); serve(); }
      return;
    }

    if (grid.size === 0) {                     // เคลียร์หมด → ตั้งกำแพงใหม่
      setScore(score + 200);
      build();
      serve();
    }
  }

  /* ── วาด ─────────────────────────────────── */
  function drawIcon(kind, x, y) {
    const P = cssVar('--paper') || '#F4F4F4';
    const k = DROP_R / 13;
    ctx.save();
    ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-x, -y);
    ctx.fillStyle = P; ctx.strokeStyle = P; ctx.lineWidth = 2; ctx.lineCap = 'butt';
    if (kind === 'wide') {
      ctx.fillRect(x - 7, y - 1.5, 14, 3);
      ctx.fillRect(x - 7, y - 5, 2, 10);
      ctx.fillRect(x + 5, y - 5, 2, 10);
    } else if (kind === 'multi') {
      for (const dx of [-5, 0, 5]) { ctx.beginPath(); ctx.arc(x + dx, y, 1.9, 0, 6.284); ctx.fill(); }
    } else {
      ctx.beginPath(); ctx.arc(x, y, 5.5, 0, 6.284); ctx.stroke();
      ctx.fillRect(x - 0.9, y - 4, 1.8, 4.6);
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, Wp, Hp);
    const INK = cssVar('--ink') || '#121212';
    const LIVE = cssVar('--live') || '#F0421E';
    const inset = Math.max(0.5, Math.min(1.6, bw * 0.09));

    ctx.fillStyle = INK;                       // อิฐ
    for (const k of grid.keys()) {
      const c = Math.floor(k / 64), r = k - c * 64;
      ctx.fillRect(ox + c * bw + inset, oy + r * bh + inset, bw - inset * 2, bh - inset * 2);
    }

    for (const p of pops) {                    // กรอบขยายตอนอิฐแตก
      const t = p.t / 0.32, g = (1 + t * 1.2);
      ctx.globalAlpha = (1 - t) * 0.5;
      ctx.strokeStyle = INK; ctx.lineWidth = 1;
      ctx.strokeRect(p.x - bw * g / 2, p.y - bh * g / 2, bw * g, bh * g);
    }
    ctx.globalAlpha = 1;

    for (const d of drops) {                   // ไอเทม
      ctx.fillStyle = LIVE;
      ctx.fillRect(d.x - DROP_R, d.y - DROP_R, DROP_R * 2, DROP_R * 2);
      drawIcon(d.kind, d.x, d.y);
    }

    for (const r of rings) {                   // วงตอนเก็บไอเทม
      const t = r.t / 0.4;
      ctx.globalAlpha = (1 - t) * 0.7;
      ctx.strokeStyle = LIVE; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, DROP_R + t * 30, 0, 6.284); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const b of balls) {                   // หางลูกบอล
      for (let i = 0; i < b.tr.length; i++) {
        const t = (i + 1) / b.tr.length;
        ctx.globalAlpha = t * 0.18;
        ctx.fillStyle = LIVE;
        ctx.beginPath(); ctx.arc(b.tr[i].x, b.tr[i].y, b.r * t * 0.85, 0, 6.284); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = INK;                       // ไม้
    ctx.fillRect(pad.x, pad.y, pad.w, pad.h);
    if (slowT > 0) { ctx.fillStyle = LIVE; ctx.fillRect(pad.x, pad.y + pad.h, pad.w, 1.5); }

    ctx.fillStyle = LIVE;                      // ลูกบอล
    for (const b of balls) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.284); ctx.fill(); }
  }

  /* ── ลูป ─────────────────────────────────── */
  let last = performance.now(), running = true;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000));
    last = now;
    if (running) update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    last = performance.now();
  });

  /* ── การควบคุม ───────────────────────────── */
  const onLink = e => !!(e.target && e.target.closest && e.target.closest('a'));
  function aim(clientX) {
    const r = cv.getBoundingClientRect();
    pad.x = Math.max(0, Math.min(Wp - pad.w, clientX - r.left - pad.w / 2));
  }
  addEventListener('pointermove', e => aim(e.clientX), { passive: true });
  addEventListener('pointerdown', e => {
    if (onLink(e)) return;
    aim(e.clientX);
    launch();
  });
  cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.r = true;
    if (e.code === 'Space' && !onLink(e)) { e.preventDefault(); launch(); }
  });
  addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.r = false;
  });

  addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

  /* ── เริ่ม ────────────────────────────────── */
  hint.textContent = coarse ? 'Tap to launch' : 'Click to launch';
  slot.classList.add('live');
  build();
  serve();
  setScore(0);
  setLives(CFG.lives);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
